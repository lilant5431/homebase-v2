name: V2 staging preview

on:
  push:
    branches: [codex/initial-product-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-pages-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/initial-product-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build -- --base=/homebase-v2/
      - name: Record deployed revision
        run: node -e "require('node:fs').writeFileSync('dist/staging.json', JSON.stringify({commit:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME}))"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4
